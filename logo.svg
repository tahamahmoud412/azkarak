<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="أذكار الصباح والمساء">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26305a"/>
      <stop offset="1" stop-color="#141a30"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3cf7a"/>
      <stop offset="1" stop-color="#d49a2e"/>
    </linearGradient>
    <mask id="crescent">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="40" cy="25" r="16" fill="#000"/>
    </mask>
  </defs>

  <!-- الخلفية -->
  <rect width="64" height="64" rx="15" fill="url(#bg)"/>

  <!-- الهلال: المساء -->
  <circle cx="30" cy="33" r="20" fill="url(#gold)" mask="url(#crescent)"/>

  <!-- الشمس جوه الهلال: الصباح -->
  <g fill="none" stroke="#f3cf7a" stroke-width="2" stroke-linecap="round" transform="translate(41 24)">
    <circle r="4.2" fill="#f3cf7a" stroke="none"/>
    <path d="M0 -7.5v-2.5M0 7.5v2.5M-7.5 0h-2.5M7.5 0h2.5M5.3 -5.3l1.8 -1.8M-5.3 5.3l-1.8 1.8M5.3 5.3l1.8 1.8M-5.3 -5.3l-1.8 -1.8"/>
  </g>
</svg>
