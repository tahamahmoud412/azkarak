<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>أذكارك — أذكار الصباح والمساء</title>
  <meta name="description" content="أذكار الصباح والمساء مع العدّاد وفضل كل ذكر.">
  <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#11161f" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/svg+xml" href="logo.svg?v=3">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="أذكارك">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=8">
</head>
<body data-time="morning">
  <header class="top">
    <div class="top-inner">
      <div class="brand">
        <img class="logo" src="logo.svg?v=3" alt="" width="40" height="40">
        <h1 class="title">أذكارك</h1>
      </div>
      <div class="tools">
        <button class="install-btn" id="installBtn" hidden>تثبيت</button>
        <button class="icon-btn" id="fontDown" aria-label="تصغير الخط">ا-</button>
        <button class="icon-btn" id="fontUp" aria-label="تكبير الخط">ا+</button>
        <button class="icon-btn" id="themeBtn" aria-label="تبديل الوضع الليلي">◐</button>
      </div>
    </div>

    <nav class="tabs" role="tablist">
      <button role="tab" class="tab" data-time="morning" aria-selected="true">☀️ الصباح</button>
      <button role="tab" class="tab" data-time="evening" aria-selected="false">🌙 المساء</button>
    </nav>

    <div class="progress" aria-hidden="true"><div class="progress-bar" id="progressBar"></div></div>
    <p class="progress-text" id="progressText"></p>
  </header>

  <main id="list" class="list" aria-live="polite">
    <p class="status">جارٍ تحميل الأذكار…</p>
  </main>

  <section class="done" id="doneBox" hidden>
    <p class="done-title">تقبّل الله منك 🤍</p>
    <p class="done-sub">أتممت أذكار <span id="doneTime">الصباح</span></p>
    <button class="btn" id="resetBtn2">ابدأ من جديد</button>
  </section>

  <footer class="foot">
    <button class="link-btn" id="resetBtn">إعادة العدّ</button>
    <p class="copy">
      <span>© 2026</span>
      <!-- توقيع طه وشهد: حرف T بيكمّل في S بخط واحد، وفي الآخر نقطة عسل (شهد = عسل) -->
      <a class="sig" href="https://github.com/tahamahmoud412" target="_blank" rel="noopener" title="Taha &amp; Shahd" aria-label="Taha &amp; Shahd">
        <svg viewBox="0 0 60 64" aria-hidden="true">
          <path class="sig-line" d="M6 13 C18 8.5 36 8.5 49 11.5 C54 12.8 52.5 20 45 20 C35 20 22 21 22 29 C22 37 44 33.5 44 43 C44 51.5 31 54 25.5 50"/>
          <path class="sig-drop" d="M22 51 C25 55 26.2 57 26.2 58.6 A4.2 4.2 0 0 1 17.8 58.6 C17.8 57 19 55 22 51 Z"/>
        </svg>
      </a>
    </p>
  </footer>

  <script src="virtues.js?v=2"></script>
  <script src="app.js?v=8"></script>
</body>
</html>
